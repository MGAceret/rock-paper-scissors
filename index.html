<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="wrapper">
        <div class="score">
            <div>
                <h2>Player - </h2>
                <h2 class="playerScore"></h2>
            </div>
            <div>
                <h2>Opponent - </h2>
                <h2 class="opponentScore"></h2>
            </div>
        </div>
        <div class="display">
            <div>
                Player
                <img class="playerOption">
            </div>
            <div>
                Opponent
                <img class="opponentOption">
            </div>
        </div>
        <div class="playerSelection">
            <button onclick="playRound('Rock')" class="option">Rock</button>
            <button onclick="playRound('Paper')" class="option">Paper</button>
            <button onclick="playRound('Scissors')" class="option">Scissors</button>
        </div>
    </div>



<script src="script/script.js"></script>    
</body>
</html>
